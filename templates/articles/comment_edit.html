{% extends "base.html" %}
{% block title %}Modifier mon commentaire — SportNews Live{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow-sm border border-gray-100 p-6">
    <h1 class="text-xl font-black text-brand-dark mb-4">Modifier mon commentaire</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            {{ form.content }}
            {% if form.content.errors %}<p class="text-xs text-red-600 mt-1">{{ form.content.errors.0 }}</p>{% endif %}
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-brand text-white font-bold uppercase text-sm px-6 py-2.5 rounded-md hover:bg-red-700 transition">
                Enregistrer
            </button>
            <a href="{{ comment.article.get_absolute_url }}" class="text-sm text-gray-500 px-4 py-2.5 hover:text-gray-800">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
