{% extends "base.html" %}
{% block title %}Supprimer le commentaire — SportNews Live{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-sm border border-gray-100 p-8 text-center">
    <h1 class="text-xl font-black text-brand-dark mb-2">Supprimer ce commentaire ?</h1>
    <p class="text-gray-600 mb-1 italic">« {{ comment.content|truncatewords:20 }} »</p>
    <p class="text-sm text-gray-400 mb-6">— {{ comment.name }}</p>
    <form method="post" class="flex justify-center gap-3">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white font-bold uppercase text-sm px-6 py-2.5 rounded-md hover:bg-red-700 transition">
            Oui, supprimer
        </button>
        <a href="{{ comment.article.get_absolute_url }}" class="text-sm text-gray-500 px-4 py-2.5 hover:text-gray-800">Annuler</a>
    </form>
</div>
{% endblock %}
